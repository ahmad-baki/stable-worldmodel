defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random # ckpt name or random
rl_algo: null

# load the policy from a wandb training run's reference artifact.
# when wandb.run is set it takes precedence over `policy` above, and the eval
# success rate is written back into that run's summary.
wandb:
  entity: ahmad-baki-karlsruhe-institute-of-technology
  project: worldbench-bc
  run: null # wandb run id, e.g. dinogcbc_4069292
  alias: best # which logged artifact version to use (best/latest/epoch_XXXX)

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:  
  use_dataset: false 
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train.h5
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

compile: false
bf16: false

output:
  filename: pusht_results.txt
